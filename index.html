<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CINEMA HOUSE — Домашние кинозалы премиум-класса под ключ</title>
<meta name="description" content="Проектируем и строим премиальные домашние кинозалы под ключ. Акустика, оборудование, калибровка. Шоу-рум в Москве.">
<meta property="og:title" content="CINEMA HOUSE — Домашние кинозалы премиум-класса">
<meta property="og:description" content="Погружение как в кинотеатре — не выходя из дома.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Playfair+Display:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --bg-2:#111111;
    --bg-3:#181818;
    --line:rgba(255,255,255,0.08);
    --text:#ece7dc;
    --muted:#8a8680;
    --gold:#c9a961;
    --gold-soft:#b8944a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    opacity:0.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  img{display:block;max-width:100%;height:auto}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  .nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:26px 5vw;
    display:flex;align-items:center;justify-content:space-between;
    transition:all .4s ease;
  }
  .nav.scrolled{
    padding:16px 5vw;
    background:rgba(10,10,10,0.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
  }
  .logo{
    font-family:'Playfair Display',serif;
    font-size:21px;letter-spacing:3.5px;font-weight:500;
  }
  .logo span{color:var(--gold)}
  .nav-links{
    display:flex;gap:40px;list-style:none;
    font-size:13px;letter-spacing:1.6px;text-transform:uppercase;
  }
  .nav-links a{position:relative;padding:6px 0;transition:color .3s}
  .nav-links a:hover{color:var(--gold)}
  .nav-links a::after{
    content:'';position:absolute;bottom:0;left:0;
    width:0;height:1px;background:var(--gold);transition:width .3s;
  }
  .nav-links a:hover::after{width:100%}
  .nav-cta{
    padding:11px 22px;
    border:1px solid var(--gold);
    color:var(--gold);
    font-size:12px;letter-spacing:1.8px;text-transform:uppercase;
    transition:all .3s;
  }
  .nav-cta:hover{background:var(--gold);color:#0a0a0a}
  .burger{display:none;flex-direction:column;gap:5px;cursor:pointer;z-index:101}
  .burger span{width:26px;height:1px;background:var(--text);transition:all .3s}
  .menu-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    opacity:0;pointer-events:none;transition:opacity .4s;z-index:99;
  }
  .menu-overlay.active{opacity:1;pointer-events:all}

  .hero{
    position:relative;
    height:100vh;min-height:700px;
    display:flex;align-items:center;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg,rgba(10,10,10,0.35) 0%,rgba(10,10,10,0.65) 55%,rgba(10,10,10,1) 100%),
      url('https://images.unsplash.com/photo-yzgerM8efDU?w=1920&q=80') center/cover no-repeat;
    transform:scale(1.04);
    animation:slowZoom 22s ease-in-out infinite alternate;
  }
  @keyframes slowZoom{to{transform:scale(1.14)}}
  .hero-content{position:relative;z-index:2;padding:0 5vw;max-width:1080px}
  .hero-tag{
    display:inline-flex;align-items:center;gap:12px;
    font-size:12px;letter-spacing:3px;text-transform:uppercase;
    color:var(--gold);margin-bottom:28px;
    opacity:0;animation:fadeUp 1s .2s forwards;
  }
  .hero-tag::before{content:'';width:36px;height:1px;background:var(--gold)}
  .hero h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(38px,6.2vw,92px);
    font-weight:400;line-height:1.05;letter-spacing:-0.5px;
    margin-bottom:28px;
    opacity:0;animation:fadeUp 1.1s .4s forwards;
  }
  .hero h1 em{font-style:italic;color:var(--gold);font-weight:300}
  .hero p{
    font-size:clamp(16px,1.35vw,19px);
    color:var(--muted);max-width:600px;margin-bottom:42px;font-weight:300;
    opacity:0;animation:fadeUp 1.1s .6s forwards;
  }
  .hero-buttons{display:flex;gap:18px;flex-wrap:wrap;opacity:0;animation:fadeUp 1.1s .8s forwards}
  .btn-primary{
    padding:17px 38px;background:var(--gold);color:#0a0a0a;
    font-size:13px;letter-spacing:1.8px;text-transform:uppercase;font-weight:500;
    transition:all .3s;
  }
  .btn-primary:hover{background:var(--gold-soft);transform:translateY(-2px);box-shadow:0 14px 40px rgba(201,169,97,.28)}
  .btn-secondary{
    padding:17px 38px;border:1px solid rgba(236,231,220,.3);
    font-size:13px;letter-spacing:1.8px;text-transform:uppercase;font-weight:500;
    transition:all .3s;
  }
  .btn-secondary:hover{border-color:var(--gold);color:var(--gold)}
  .hero-scroll{
    position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    opacity:0;animation:fadeUp 1.1s 1.1s forwards;
  }
  .hero-scroll::after{
    content:'';width:1px;height:36px;background:var(--gold);
    animation:scrollLine 2s ease-in-out infinite;
  }
  @keyframes scrollLine{
    0%,100%{transform:scaleY(.3);transform-origin:top}
    50%{transform:scaleY(1);transform-origin:top}
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

  section{padding:130px 5vw;position:relative}
  .section-label{
    display:inline-flex;align-items:center;gap:12px;
    font-size:12px;letter-spacing:2.8px;text-transform:uppercase;color:var(--gold);margin-bottom:22px;
  }
  .section-label::before{content:'';width:36px;height:1px;background:var(--gold)}
  .section-title{
    font-family:'Playfair Display',serif;
    font-size:clamp(30px,4.2vw,60px);font-weight:400;line-height:1.1;letter-spacing:-.4px;
    margin-bottom:24px;max-width:880px;
  }
  .section-title em{font-style:italic;color:var(--gold);font-weight:300}
  .section-sub{color:var(--muted);font-size:16.5px;max-width:620px;font-weight:300;margin-bottom:70px}

  .about{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:90px;align-items:center}
  .about-stats{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:50px}
  .stat{padding:28px 0;border-top:1px solid var(--line)}
  .stat-num{
    font-family:'Playfair Display',serif;font-size:52px;color:var(--gold);font-weight:400;line-height:1;margin-bottom:8px;
  }
  .stat-label{font-size:12.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
  .about-image{position:relative;aspect-ratio:4/5;overflow:hidden}
  .about-image img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s ease}
  .about-image:hover img{transform:scale(1.04)}
  .about-image::after{
    content:'CEDIA';position:absolute;bottom:26px;right:26px;
    font-size:11px;letter-spacing:2.5px;color:var(--gold);
    padding:9px 16px;border:1px solid var(--gold);background:rgba(10,10,10,.65);backdrop-filter:blur(8px);
  }

  .features{
    display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
    margin-top:90px;border:1px solid var(--line);
  }
  .feature{background:var(--bg);padding:42px 28px;transition:background .4s}
  .feature:hover{background:var(--bg-3)}
  .feature-icon{width:36px;height:36px;margin-bottom:24px;color:var(--gold)}
  .feature h4{font-family:'Playfair Display',serif;font-size:19px;font-weight:400;margin-bottom:12px}
  .feature p{font-size:14px;color:var(--muted);line-height:1.55;font-weight:300}

  .portfolio-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:50px;flex-wrap:wrap;gap:24px}
  .portfolio-scroll{
    display:flex;gap:28px;overflow-x:auto;padding-bottom:30px;
    scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--gold) var(--bg-2);
  }
  .portfolio-scroll::-webkit-scrollbar{height:3px}
  .portfolio-scroll::-webkit-scrollbar-track{background:var(--bg-2)}
  .portfolio-scroll::-webkit-scrollbar-thumb{background:var(--gold)}
  .project{flex:0 0 460px;scroll-snap-align:start;cursor:pointer}
  .project-img{aspect-ratio:4/3;overflow:hidden;margin-bottom:20px;position:relative}
  .project-img img{width:100%;height:100%;object-fit:cover;transition:transform .9s ease}
  .project:hover .project-img img{transform:scale(1.07)}
  .project-view{
    position:absolute;bottom:20px;left:20px;z-index:2;
    font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);
    opacity:0;transform:translateY(8px);transition:all .4s;
  }
  .project:hover .project-view{opacity:1;transform:translateY(0)}
  .project-num{font-size:12px;color:var(--gold);letter-spacing:1.8px;margin-bottom:8px}
  .project h3{font-family:'Playfair Display',serif;font-size:26px;font-weight:400;margin-bottom:12px}
  .project-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
  .project-meta span{display:inline-flex;align-items:center;gap:7px}
  .project-meta span::before{content:'';width:4px;height:4px;background:var(--gold);border-radius:50%}
  .project-tags{display:flex;gap:8px;flex-wrap:wrap}
  .project-tag{padding:5px 12px;border:1px solid var(--line);font-size:11px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}

  .modal{
    position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .35s;
  }
  .modal.active{opacity:1;pointer-events:all}
  .modal-content{
    background:var(--bg-2);border:1px solid var(--line);max-width:920px;width:92%;
    max-height:90vh;overflow-y:auto;position:relative;
  }
  .modal-close{
    position:absolute;top:18px;right:18px;width:40px;height:40px;
    border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;z-index:2;transition:all .3s;
  }
  .modal-close:hover{border-color:var(--gold);color:var(--gold)}
  .modal-img{width:100%;aspect-ratio:16/9;object-fit:cover}
  .modal-body{padding:40px 36px}
  .modal-body h3{font-family:'Playfair Display',serif;font-size:32px;font-weight:400;margin-bottom:12px}
  .modal-body p{color:var(--muted);font-weight:300;line-height:1.7;margin-bottom:20px}

  .showroom{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .showroom-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:70px;align-items:center}
  .showroom-image{position:relative;aspect-ratio:16/11;overflow:hidden}
  .showroom-image img{width:100%;height:100%;object-fit:cover}
  .showroom-badge{
    position:absolute;top:24px;left:24px;padding:10px 18px;
    background:rgba(10,10,10,.
